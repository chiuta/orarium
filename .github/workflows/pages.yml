name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Hubul fff-kit (pentru verificarea de actualitate)
        uses: actions/checkout@v4
        with:
          repository: chiuta/chiuta.github.io
          path: .hub
      - name: Validate translations and check index.html is up to date
        env:
          FFF_HUB: ${{ github.workspace }}/.hub
        run: |
          python3 tools/validate.py
          python3 tools/check_fresh.py
      - name: Prepare site
        run: mkdir _site && cp index.html LICENSE _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
